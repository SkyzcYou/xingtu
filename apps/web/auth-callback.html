<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xingtu 登录回调</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        background: #050508;
        color: #f7fbff;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 22% 18%, rgba(82, 230, 255, 0.18), transparent 28%),
          radial-gradient(circle at 74% 28%, rgba(243, 156, 18, 0.16), transparent 30%),
          linear-gradient(180deg, #080914 0%, #050508 100%);
      }
      .card {
        width: min(100% - 32px, 440px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 28px;
        padding: 34px;
        background: rgba(255, 255, 255, 0.06);
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.1), 0 24px 80px rgba(0, 0, 0, 0.35);
        text-align: center;
      }
      .logo {
        width: 48px;
        height: 48px;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 28px;
        letter-spacing: -0.04em;
      }
      p {
        margin: 0;
        color: #b9c3d4;
        line-height: 1.7;
      }
      .error {
        margin-top: 18px;
        color: #fecaca;
        word-break: break-word;
      }
      .actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 24px;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        padding: 0 16px;
        border: 1px solid rgba(82, 230, 255, 0.32);
        border-radius: 999px;
        color: #f7fbff;
        background: rgba(82, 230, 255, 0.1);
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card" aria-live="polite">
      <img class="logo" src="/icons/favicon-new.svg" alt="Xingtu 星图" />
      <h1>正在完成登录</h1>
      <p id="auth-status">正在处理 Trust 回调...</p>
      <p id="auth-error" class="error" hidden></p>
      <div id="auth-actions" class="actions" hidden>
        <a class="button" href="/home.html">返回首页</a>
        <a class="button" href="/auth-login.html">重新登录</a>
      </div>
    </main>
    <script type="module" src="/src/auth/callback.ts"></script>
  </body>
</html>
